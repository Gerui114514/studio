<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人空间 - 智软工作室</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../CSS/index/main.css">
    <link rel="stylesheet" href="../CSS/profile/profile.css">
    <link rel="stylesheet" href="../CSS/index/nav.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="logo"><a href="index.html" style="text-decoration:none; color:inherit;">智软<span>·工作室</span></a></div>
            <div class="menu-toggle" id="mobile-menu"><i class="fas fa-bars"></i></div>
            <div class="nav-links" id="nav-links">
                <a href="../index.html#home">首页</a>
                <a href="../index.html#services">服务</a>
                <a href="../index.html#works">作品</a>
                <a href="../index.html#about">关于</a>
                <a href="../index.html#contact">联系</a>
                <div id="auth-area"></div>
            </div>
        </div>
    </nav>

    <main class="profile-container">
        <div class="container">
            <div class="profile-header">
                <div class="profile-avatar">
                    <i class="fas fa-user-circle fa-4x"></i>
                </div>
                <div class="profile-title">
                    <h1>个人空间</h1>
                    <p>欢迎回来，<span id="profileUsername"></span></p>
                </div>
                <div id= "admin-btn" class="profile-btn">
                    <button type="submit" class="detail-btn">管理后台</button>
                </div>
            </div>

            <div class="profile-grid">
                <!-- 个人信息卡片 -->
                <div class="card info-card">
                    <h3><i class="fas fa-user-edit"></i> 个人信息</h3>
                        <!-- <div class="form-group">
                            <label>头像</label>
                            <div class="avatar-upload">
                                <img id="avatarPreview" src="https://via.placeholder.com/80" alt="avatar">
                                <button type="button" id="uploadAvatarBtn" class="detail-btn">更换头像</button>
                            </div>
                        </div> -->
                        <div class="form-group">
                            <label>用户名</label>
                            <input type="text" id="editUsername" disabled>
                        </div>
                        <div class="form-group">
                            <label>邮箱</label>
                            <input type="email" id="editEmail">
                        </div>
                        <div class="form-group">
                            <label>姓名</label>
                            <input type="nanme" id="editName">
                        </div>
                        <div class="form-group">
                            <label>加入日期</label>
                            <input type="birthday" id="editJoindate" disableds>
                        </div>
                        <div class="form-group">
                            <label>所在地</label>
                            <input type="region" id="editRegion">
                        </div>
                        <div class="form-group">
                            <label>职业</label>
                            <input type="job" id="editJob">
                        </div>
                        <div class="profile-btn">
                            <input type="file" class="file-input" id="editAvater">
                            <label for="editAvater" class="detail-btn">选择头像</label>
                            <button type="submit" class="detail-btn" id="edit">保存修改</button>
                        </div>
                </div>

                <!-- 我的项目卡片 -->
                <div class="card projects-card">
                    <h3><i class="fas fa-code-branch"></i> 我的项目</h3>
                    <div id="myProjectsList">
                        <!-- 动态加载项目列表 -->
                    </div>
                    <div class="profile-btn">
                        <button class="detail-btn" id="viewAllProjects">查看全部</button>
                    </div>
                </div>

                <!-- 活动记录卡片 -->
                <div class="card activity-card">
                    <h3><i class="fas fa-history"></i> 最近活动</h3>
                    <ul class="activity-list">
                        <li><i class="fas fa-check-circle"></i> 登录了系统 - 刚刚</li>
                        <li><i class="fas fa-edit"></i> 更新了个人资料 - 2天前</li>
                        <li><i class="fas fa-comment"></i> 提交了项目咨询 - 5天前</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>© 2025 智软工作室 | 匠心代码 · 极简美学</p>
        </div>
    </footer>

    <script src="../Script/profile/profile.js"></script>
    <script src="../Script/axios.min.js"></script>
    <!-- <script src="../Script/index.js"></script> -->
</body>
</html>
